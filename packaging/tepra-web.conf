# TEPRA Web printing server の設定 (systemd の EnvironmentFile)
# 変更したら: sudo systemctl restart tepra-web

# 機種。解像度とテープ幅ごとのドット数が変わる (sr3900p / sr3700p)
TEPRA_MODEL=sr3900p

# 待ち受け。認証は無いので、外に出すならリバースプロキシ側で行うこと
TEPRA_HOST=0.0.0.0
TEPRA_PORT=8080

# USB Product ID (16進)。lsusb の 0d8a:xxxx の xxxx。
# 設定しない場合はドライバ既定の 0103 (SR3700P / SR750) を探す
#TEPRA_PID=0103

# ドライバとデータの置き場。通常は変更不要
TEPRA_DRIVER=/usr/lib/tepra-web/tpsr3700
TEPRA_FONTS_DIR=/var/lib/tepra-web/fonts
TEPRA_HISTORY=/var/lib/tepra-web/history.json
TEPRA_TEMPLATES=/var/lib/tepra-web/templates.json

# 実機なしで動作を見るときは 1 にする (印刷せずジョブを生成するだけ)
#TEPRA_DRY_RUN=1
